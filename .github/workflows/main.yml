name: Release Firmware

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Upload Binaries as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bruce-firmware-bin
          path: *.bin
